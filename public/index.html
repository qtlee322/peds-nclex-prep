<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pediatric NCLEX Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F2;
  --paper:#FFFFFF;
  --rail:#E3EAE8;
  --ink:#172524;
  --ink-soft:#4C5D5C;
  --line:#D4DEDC;
  --teal:#0F6E6E;
  --teal-deep:#0A4F4F;
  --teal-pale:#DCEEEC;
  --brick:#B3431B;
  --brick-pale:#FBE7DD;
  --green:#2E7D4F;
  --green-pale:#DFF0E4;
  --amber:#8A6D1F;
  --amber-pale:#F7EFD6;
  --radius-card:10px;
  --radius-chip:999px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121918; --paper:#182221; --rail:#1C2726; --ink:#EAF1EF; --ink-soft:#9FB3B0;
    --line:#2A3736; --teal:#3FBFB2; --teal-deep:#2E9B90; --teal-pale:#17302E;
    --brick:#E08A5E; --brick-pale:#2E2019; --green:#6FCB95; --green-pale:#163024;
    --amber:#E3C46B; --amber-pale:#2E280F;
  }
}
:root[data-theme="dark"]{
  --bg:#121918; --paper:#182221; --rail:#1C2726; --ink:#EAF1EF; --ink-soft:#9FB3B0;
  --line:#2A3736; --teal:#3FBFB2; --teal-deep:#2E9B90; --teal-pale:#17302E;
  --brick:#E08A5E; --brick-pale:#2E2019; --green:#6FCB95; --green-pale:#163024;
  --amber:#E3C46B; --amber-pale:#2E280F;
}
*{box-sizing:border-box;}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans', system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'IBM Plex Serif', Georgia, serif; font-weight:600; margin:0;}
.app{max-width:1040px; margin:0 auto; padding:28px 18px 120px;}
.masthead{
  display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
  border-bottom:3px solid var(--teal); padding-bottom:16px; margin-bottom:22px; flex-wrap:wrap;
}
.masthead h1{font-size:28px; color:var(--teal-deep); letter-spacing:-0.01em;}
.masthead p{margin:4px 0 0; color:var(--ink-soft); font-size:14px; max-width:46ch;}
.masthead-right{display:flex; align-items:center; gap:10px;}
.chip-count{
  font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--teal-deep);
  background:var(--teal-pale); border-radius:var(--radius-chip); padding:5px 11px; white-space:nowrap;
}
.layout{display:grid; grid-template-columns:200px 1fr; gap:22px; align-items:start;}
@media (max-width:760px){ .layout{grid-template-columns:1fr;} }

.rail{
  background:var(--rail); border-radius:var(--radius-card); padding:10px; position:sticky; top:10px;
  display:flex; flex-direction:column; gap:4px;
}
@media (max-width:760px){
  .rail{position:static; flex-direction:row; overflow-x:auto; gap:8px; padding:8px;}
}
.rail button{
  all:unset; cursor:pointer; padding:11px 12px; border-radius:7px; font-size:13.5px; line-height:1.3;
  color:var(--ink-soft); border-left:3px solid transparent;
}
@media (max-width:760px){
  .rail button{border-left:none; border-bottom:3px solid transparent; white-space:nowrap; flex:0 0 auto;}
}
.rail button .n{display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; opacity:.75; margin-bottom:2px;}
.rail button:hover{background:var(--paper); color:var(--ink);}
.rail button.active{background:var(--paper); color:var(--teal-deep); border-left-color:var(--teal); font-weight:600;}
@media (max-width:760px){ .rail button.active{border-bottom-color:var(--teal);} }

.panel{min-width:0;}
.intro-card{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-card);
  padding:20px 22px; margin-bottom:18px;
}
.intro-card h2{font-size:21px; color:var(--teal-deep); margin-bottom:6px;}
.intro-card .meta{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); margin-bottom:10px;}
.intro-card p{margin:0; color:var(--ink-soft); font-size:14px; line-height:1.55; max-width:62ch;}

.score-banner{
  border-radius:var(--radius-card); padding:18px 22px; margin-bottom:18px; display:none;
  border:1px solid var(--line);
}
.score-banner.show{display:block;}
.score-banner .big{font-family:'IBM Plex Serif',serif; font-size:32px; font-weight:700;}
.score-banner .sub{font-size:13px; color:var(--ink-soft); margin-top:2px;}

.note{
  background:var(--amber-pale); border:1px solid var(--line); border-left:4px solid var(--amber);
  border-radius:8px; padding:14px 16px; margin:18px 0 14px; font-size:13.5px; line-height:1.55; color:var(--ink);
}
.note .label{font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--amber); display:block; margin-bottom:5px;}

.q{
  background:var(--paper); border:1px solid var(--line); border-left:4px solid var(--line);
  border-radius:var(--radius-card); padding:16px 18px; margin-bottom:12px; scroll-margin-top:14px;
  transition:border-color .2s ease;
}
.q.correct{border-left-color:var(--green);}
.q.incorrect{border-left-color:var(--brick);}
.q-head{display:flex; align-items:baseline; gap:10px; margin-bottom:9px;}
.q-num{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--teal-deep); flex:0 0 auto;}
.q-type{
  font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.03em; padding:2px 7px;
  border-radius:var(--radius-chip); background:var(--teal-pale); color:var(--teal-deep); flex:0 0 auto;
}
.q-type.sata{background:var(--brick-pale); color:var(--brick);}
.q-prompt{font-size:15px; line-height:1.5; margin:0;}
.q-sata-hint{font-size:11.5px; color:var(--ink-soft); font-style:italic; margin:4px 0 0;}

.opts{margin-top:12px; display:flex; flex-direction:column; gap:7px;}
.opt{
  display:flex; align-items:flex-start; gap:10px; padding:9px 11px; border-radius:7px;
  border:1px solid var(--line); cursor:pointer; font-size:14px; line-height:1.4;
}
.opt:hover{background:var(--teal-pale);}
.opt input{margin-top:2px; accent-color:var(--teal); flex:0 0 auto; width:16px; height:16px;}
.opt .key{font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--teal-deep); flex:0 0 auto;}
.q.locked .opt{cursor:default;}
.q.locked .opt:hover{background:none;}
.opt.is-correct{background:var(--green-pale); border-color:var(--green);}
.opt.is-wrong{background:var(--brick-pale); border-color:var(--brick);}

.rationale{
  display:none; margin-top:12px; padding:11px 13px; background:var(--teal-pale);
  border-radius:7px; font-size:13.5px; line-height:1.55; color:var(--ink);
}
.rationale .label{font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--teal-deep); display:block; margin-bottom:4px;}
.q.locked .rationale{display:block;}

.footer-bar{
  position:fixed; left:0; right:0; bottom:0; background:var(--paper); border-top:1px solid var(--line);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom, 0px));
  display:flex; align-items:center; justify-content:space-between; gap:14px; z-index:10;
}
.footer-inner{max-width:1040px; margin:0 auto; width:100%; display:flex; align-items:center; justify-content:space-between; gap:14px;}
.progress-text{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); white-space:nowrap;}
.btn-group{display:flex; gap:10px;}
button.primary, button.ghost{
  font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size:13.5px; border-radius:7px;
  padding:10px 18px; cursor:pointer; border:1px solid transparent;
}
button.primary{background:var(--teal-deep); color:#fff;}
button.primary:disabled{background:var(--line); color:var(--ink-soft); cursor:not-allowed;}
button.ghost{background:transparent; color:var(--ink-soft); border-color:var(--line);}
button.ghost:hover{color:var(--ink); border-color:var(--ink-soft);}
.auth{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-soft);}
.auth img{width:26px; height:26px; border-radius:50%;}
.auth .sync{font-family:'IBM Plex Mono',monospace; font-size:11px;}
.auth button{font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:12.5px; border-radius:7px; padding:7px 12px; cursor:pointer; border:1px solid var(--line); background:var(--paper); color:var(--ink);}
.auth button.signin{background:var(--teal-deep); color:#fff; border-color:transparent;}
.history{margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--teal-deep);}
.modes{display:inline-flex; background:var(--rail); border-radius:9px; padding:4px; gap:4px; margin-bottom:18px;}
.modes button{all:unset; cursor:pointer; padding:8px 16px; border-radius:6px; font-weight:600; font-size:13.5px; color:var(--ink-soft);}
.modes button.active{background:var(--paper); color:var(--teal-deep); box-shadow:0 1px 2px rgba(0,0,0,.08);}
.hidden{display:none !important;}
.quiz-wrap{max-width:720px; margin:0 auto;}
.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-card); padding:20px 22px; margin-bottom:14px;}
.card h2{font-size:21px; color:var(--teal-deep); margin-bottom:6px;}
.card p.sub{margin:0 0 14px; color:var(--ink-soft); font-size:14px; line-height:1.5;}
.topic-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px; margin:10px 0 16px;}
.topic{display:flex; gap:9px; align-items:flex-start; border:1px solid var(--line); border-radius:8px; padding:10px 12px; cursor:pointer; font-size:13.5px; line-height:1.35;}
.topic input{accent-color:var(--teal); margin-top:2px;}
.topic small{display:block; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:11px; margin-top:2px;}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.row label{font-size:13.5px; color:var(--ink-soft); display:flex; gap:6px; align-items:center;}
.row select{font:inherit; padding:7px 9px; border-radius:7px; border:1px solid var(--line); background:var(--paper); color:var(--ink);}
.bar{height:6px; background:var(--rail); border-radius:99px; overflow:hidden; margin:4px 0 14px;}
.bar > i{display:block; height:100%; background:var(--teal); transition:width .25s ease;}
.quiz-top{display:flex; justify-content:space-between; align-items:center; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft);}
.feedback{margin-top:12px; padding:10px 13px; border-radius:7px; font-weight:600; font-size:14px;}
.feedback.ok{background:var(--green-pale); color:var(--green);}
.feedback.bad{background:var(--brick-pale); color:var(--brick);}
.quiz .rationale{display:block;}
.missed-list{margin:10px 0 0; padding-left:18px; font-size:13.5px; line-height:1.5; color:var(--ink-soft);}
</style>
</head>
<body>
<div class="app">
  <div class="masthead">
    <div>
      <h1>Pediatric NCLEX Prep</h1>
      <p>Five practice sets built from your course objectives — musculoskeletal, integumentary, hematology/immunology/oncology, ENT &amp; eye, plus a combined 50-item exam.</p>
    </div>
    <div class="masthead-right">
      <span class="chip-count" id="railCount"></span>
      <div class="auth" id="auth"><span class="sync">Loading…</span></div>
    </div>
  </div>

  <div class="modes" id="modes">
    <button data-mode="tests" class="active">Practice Tests</button>
    <button data-mode="quiz">Quiz Mode</button>
  </div>

  <div id="quizView" class="quiz-wrap hidden"></div>

  <div class="layout" id="testsView">
    <nav class="rail" id="rail"></nav>
    <div class="panel">
      <div class="intro-card" id="introCard"></div>
      <div class="score-banner" id="scoreBanner"></div>
      <div id="noteTop"></div>
      <div id="qList"></div>
    </div>
  </div>
</div>

<div class="footer-bar" id="footerBar">
  <div class="footer-inner">
    <span class="progress-text" id="progressText">0 of 0 answered</span>
    <div class="btn-group">
      <button class="ghost" id="resetBtn">Reset</button>
      <button class="primary" id="submitBtn">Submit Test</button>
    </div>
  </div>
</div>

<script>
/* ---------- DATA ---------- */
const TESTS = [
{
  id:'t1', tab:'Test 1', title:'Musculoskeletal Disorders',
  desc:'Casting, compartment syndrome, traction, fixation, DDH, OI, clubfoot, SCFE, Legg-Calve-Perthes, osteomyelitis, septic arthritis, scoliosis, fractures, overuse syndromes, radial head subluxation.',
  items:[
    {type:'mc', prompt:"A 4-year-old has a new long-leg cast applied for a femur fracture. Which finding requires the nurse to notify the provider immediately?",
      options:[['A','Toes are warm and pink'],['B','Capillary refill of 2 seconds'],['C','Increasing pain unrelieved by medication and pain with passive stretch'],['D','Mild itching reported under the cast edge']],
      correct:['C'], rationale:"Pain unrelieved by medication and pain with passive stretch are hallmark early signs of compartment syndrome, a limb-threatening emergency requiring immediate provider notification."},
    {type:'mc', prompt:"The nurse is caring for a child in skeletal traction. Which action is appropriate?",
      options:[['A','Remove weights when repositioning the child for comfort'],['B','Ensure weights hang freely and are not resting on the floor'],['C','Release the traction ropes during linen changes'],['D','Elevate the foot of the bed above the head of the bed for all traction types']],
      correct:['B'], rationale:"Traction weights must hang freely at all times to maintain the correct pulling force; they should never rest on the floor, bed, or be removed without a provider order."},
    {type:'mc', prompt:"A newborn is diagnosed with developmental dysplasia of the hip (DDH). Which assessment finding supports this diagnosis?",
      options:[['A','Symmetric gluteal folds'],['B','Negative Ortolani sign'],['C','Limited abduction of the affected hip'],['D','Equal leg lengths bilaterally']],
      correct:['C'], rationale:"Limited abduction of the affected hip is a classic finding in DDH; asymmetric gluteal folds and a positive Ortolani/Barlow sign are also expected."},
    {type:'mc', prompt:"A child with osteogenesis imperfecta (OI) is admitted for a fracture. Which nursing action is a priority?",
      options:[['A','Encourage vigorous range-of-motion exercises'],['B','Use extreme caution when lifting, moving, and positioning the child'],['C','Apply firm pressure when taking blood pressure readings'],['D','Encourage high-impact play to build bone density']],
      correct:['B'], rationale:"Children with OI have extremely fragile bones (\"brittle bone disease\") and require gentle handling; even routine care (like BP cuffs) can cause fractures if not done carefully."},
    {type:'mc', prompt:"Which statement by a parent indicates understanding of clubfoot (talipes equinovarus) treatment using the Ponseti method?",
      options:[['A','"Surgery is always the first step in treatment."'],['B','"The cast will be changed weekly, and a brace will be worn after correction, often into early childhood."'],['C','"Bracing stops as soon as the cast is removed."'],['D','"This condition will resolve on its own without treatment."']],
      correct:['B'], rationale:"The Ponseti method involves serial weekly casting followed by long-term bracing (often full-time initially, then nighttime/naptime) to maintain correction and prevent relapse, often into early childhood."},
    {type:'mc', prompt:"A 12-year-old presents with a limp and hip/knee pain after minor trauma; the provider suspects slipped capital femoral epiphysis (SCFE). Which action should the nurse take first?",
      options:[['A','Encourage the child to walk to assess gait'],['B','Place the child on non-weight-bearing status and notify the provider'],['C','Apply heat to the hip'],['D','Administer a full dose of ibuprofen and discharge home']],
      correct:['B'], rationale:"SCFE is an orthopedic emergency; the child should be made non-weight-bearing immediately to prevent further slippage of the femoral epiphysis, and the provider notified."},
    {type:'mc', prompt:"The nurse assesses a child with suspected compartment syndrome after a fracture. Which of the \"6 P's\" is an early and most reliable indicator?",
      options:[['A','Paralysis'],['B','Pulselessness'],['C','Pain out of proportion to injury and unrelieved by analgesics'],['D','Poikilothermia']],
      correct:['C'], rationale:"Pain out of proportion to the injury and pain with passive stretch is the earliest and most sensitive indicator of compartment syndrome; pulselessness and paralysis are late, ominous signs."},
    {type:'mc', prompt:"A child with osteomyelitis is prescribed long-term IV antibiotics. Which nursing consideration is most important for discharge planning?",
      options:[['A','Antibiotics can be stopped once the child is afebrile for 24 hours'],['B','IV access (e.g., PICC line) will likely be needed for weeks of home therapy'],['C','Oral antibiotics are always preferred over IV in acute osteomyelitis'],['D','No follow-up laboratory monitoring is required']],
      correct:['B'], rationale:"Osteomyelitis typically requires prolonged (often weeks) of IV antibiotic therapy, frequently continued at home via a PICC line, requiring family education on line care."},
    {type:'mc', prompt:"Which finding in an infant is most consistent with congenital torticollis?",
      options:[['A','Head tilted toward the affected side with chin rotated to the opposite shoulder'],['B','Full, symmetric range of motion of the neck'],['C','Head held midline at all times'],['D','Absence of a palpable neck mass']],
      correct:['A'], rationale:"Congenital torticollis presents with the head tilted toward the affected (shortened) sternocleidomastoid muscle and the chin rotated to the opposite side, often with a palpable mass in the muscle."},
    {type:'mc', prompt:"A child is diagnosed with Legg-Calve-Perthes disease. Which teaching point is most appropriate?",
      options:[['A','"This is caused by an infection and requires antibiotics."'],['B','"This involves disrupted blood supply to the femoral head, and treatment focuses on containing the femoral head within the acetabulum."'],['C','"Weight-bearing activity should be encouraged to strengthen the hip."'],['D','"This condition primarily affects the spine."']],
      correct:['B'], rationale:"Legg-Calve-Perthes disease involves avascular necrosis of the femoral head due to disrupted blood supply; treatment focuses on containment (bracing, casting, or surgery) to preserve the round shape of the femoral head, with weight-bearing restrictions."},
    {type:'sata', prompt:"A nurse is providing cast care education to the parent of a school-age child. Select all instructions that are appropriate.",
      options:[['A','Keep the cast dry'],['B','Use a hair dryer on the cool setting for itching, not objects inserted inside the cast'],['C','Elevate the extremity above heart level for the first 24\u201348 hours'],['D','Cover the cast with plastic during bathing'],['E','Notify the provider for foul odor or drainage from the cast'],['F','It is safe to insert a pencil or coat hanger to scratch under the cast']],
      correct:['A','B','C','E'], rationale:"Keep casts dry, use cool-setting hair dryer for itch (never insert objects), elevate the extremity to reduce swelling, and report foul odor/drainage (signs of infection). Covering with plastic for full submersion bathing is not sufficient protection, and inserting objects can cause skin breakdown/injury."},
    {type:'sata', prompt:"Which findings are consistent with septic arthritis in a child?",
      options:[['A','Low-grade or absent fever'],['B','Warmth, swelling, and severe pain over the affected joint'],['C','Refusal to bear weight or move the limb (pseudoparalysis)'],['D','Elevated WBC, ESR, and CRP'],['E','Painless range of motion'],['F','Requires prompt joint aspiration and IV antibiotics']],
      correct:['B','C','D','F'], rationale:"Septic arthritis presents with fever, marked warmth/swelling/pain, refusal to move the joint, and elevated inflammatory markers; it requires urgent joint aspiration and IV antibiotics. Low/absent fever and painless motion are not typical."},
    {type:'sata', prompt:"A toddler presents with sudden refusal to use one arm after being swung by the hands (\"nursemaid's elbow\" / radial head subluxation). Select all findings/interventions that apply.",
      options:[['A','Arm held slightly flexed and pronated at the side'],['B','Visible deformity and bruising are typically present'],['C','Reduction is often performed by the provider via supination/flexion technique'],['D','Child typically resumes normal arm use quickly after reduction'],['E','X-ray is always required before reduction'],['F','Recurrence is possible, and caregivers should avoid pulling on the child\u2019s arms/hands']],
      correct:['A','C','D','F'], rationale:"Nursemaid's elbow presents with the arm held flexed/pronated, no visible deformity, and is reduced via a supination-flexion (or hyperpronation) maneuver; the child typically uses the arm normally within minutes. X-rays are not always needed if presentation is classic, and recurrence is common, so caregivers are taught to avoid pulling/swinging by the hands."},
    {type:'sata', prompt:"Which are risk factors or features of rickets?",
      options:[['A','Vitamin D deficiency'],['B','Bowing of the legs'],['C','Delayed closure of fontanels'],['D','Excess vitamin D intake only'],['E','Widening of the wrists'],['F','Exclusively breastfed infants without vitamin D supplementation are at higher risk']],
      correct:['A','B','C','E','F'], rationale:"Rickets results from vitamin D (and sometimes calcium/phosphorus) deficiency, causing bowed legs, delayed fontanel closure, and widened wrists; exclusively breastfed infants without vitamin D supplementation are at increased risk. Excess vitamin D is not a cause of rickets."},
    {type:'note', text:"Case Study: A 7-year-old is brought to the ED after falling off a bike. The right forearm is deformed, swollen, and the child reports 9/10 pain. A cast is applied after closed reduction of a forearm fracture. Four hours later, the child reports severe pain unrelieved by the ordered opioid, and the fingers are pale and cool with delayed capillary refill."},
    {type:'mc', prompt:"What is the priority nursing action?",
      options:[['A','Administer another dose of the same opioid and reassess in 1 hour'],['B','Elevate the arm above the heart and apply ice'],['C','Notify the provider immediately of signs suggestive of compartment syndrome'],['D','Document the finding and reassess at the next scheduled vital signs']],
      correct:['C'], rationale:"Pain unrelieved by opioids plus pallor/coolness/delayed capillary refill are signs of compartment syndrome; this requires immediate provider notification, not repeated dosing or delay."},
    {type:'sata', prompt:"Which of the following are appropriate ongoing nursing assessments for this child?",
      options:[['A','Assess the 6 P\u2019s every 1\u20132 hours or per protocol'],['B','Check capillary refill, color, temperature, and sensation of the fingers'],['C','Loosen or bivalve the cast if ordered by the provider'],['D','Delay reassessment until the next shift'],['E','Monitor for increasing pressure/tightness of the cast']],
      correct:['A','B','C','E'], rationale:"Frequent neurovascular checks, monitoring the 6 P's, and cast loosening/bivalving (per order) are appropriate; delaying reassessment is inappropriate given the acuity."},
    {type:'note', text:"Case Study: A 15-year-old female athlete reports several weeks of gradually worsening shin pain that worsens with running and improves with rest. She has no history of trauma. X-ray shows no fracture."},
    {type:'mc', prompt:"This presentation is most consistent with which condition category?",
      options:[['A','Septic arthritis'],['B','An overuse syndrome (e.g., stress reaction/shin splints)'],['C','Osteogenesis imperfecta'],['D','Slipped capital femoral epiphysis']],
      correct:['B'], rationale:"Gradual onset of pain with activity, relief with rest, and no trauma/fracture on imaging is classic for an overuse injury such as a stress reaction/shin splints, common in adolescent athletes."}
  ]
},
{
  id:'t2', tab:'Test 2', title:'Integumentary / Skin Disorders',
  desc:'Skin structure in childhood, primary/secondary lesions, burns, bacterial & fungal infections, bites/stings, inflammatory and irritant conditions.',
  items:[
    {type:'mc', prompt:"Compared to adult skin, a key characteristic of an infant's skin is:",
      options:[['A','Thicker epidermis with reduced permeability'],['B','Thinner epidermis, making it more permeable and prone to fluid loss and toxin absorption'],['C','Decreased surface-area-to-body-weight ratio'],['D','Identical thermoregulation ability to adults']],
      correct:['B'], rationale:"Infant skin is thinner, less keratinized, and more permeable than adult skin, increasing risk for fluid loss, temperature instability, and systemic absorption of topical substances."},
    {type:'mc', prompt:"A child presents with honey-colored, crusted lesions around the mouth. This is most consistent with:",

    {type:'note', text:"Case Study: A 2-year-old is brought to the ED after pulling a pot of hot coffee off the counter, spilling it on the chest and arm. The skin is red, blistered, weeping, and the child is crying and reports significant pain when the area is touched."},

let answers = {}; // key: testId::itemIndex -> array of selected keys
let locked = {};  // key: testId -> bool
let attempts = {}; // key: testId or quiz:<scope> -> [{score,total,pct,at}]
let missed = {};   // key: question id -> true (questions missed in quiz mode, cleared when answered right)
let orders = {};   // key: testId -> shuffled list of item indices for the current attempt

/* ---------- SHUFFLING ---------- */
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// Shuffle, but never return the exact same sequence as `prev` (when more than one ordering is possible).
function freshShuffle(arr, prev, sig = x => x){
  const before = prev ? prev.map(sig).join('|') : null;
  let out = shuffle(arr);
  for(let tries = 0; arr.length > 1 && before && out.map(sig).join('|') === before && tries < 20; tries++) out = shuffle(arr);
  return out;
}
// Group a test into blocks: each case study stays together with the questions that follow it.
// Which case study each question belongs to in its original test (the combined exam reuses these objects).
const CASE_OF = new Map();
TESTS.slice(0,4).forEach(t => { let note = null; t.items.forEach(it => { if(it.type === 'note') note = it; else CASE_OF.set(it, note); }); });
function testBlocks(t){
  const blocks = []; let cur = null;
  t.items.forEach((it, i) => {
    if(it.type === 'note'){ cur = { note: it, idx: [i] }; blocks.push(cur.idx); }
    else if(cur && CASE_OF.get(it) === cur.note){ cur.idx.push(i); }
    else { cur = null; blocks.push([i]); }
  });
  return blocks.filter(b => b.some(i => t.items[i].type !== 'note')); // drop case studies with no questions
}
function newOrder(t){
  const blocks = testBlocks(t);
  const prevBlocks = orders[t.id] ? blocks.slice().sort((a,b) => orders[t.id].indexOf(a[0]) - orders[t.id].indexOf(b[0])) : null;
  orders[t.id] = freshShuffle(blocks, prevBlocks, b => b[0]).flat();
}
function orderFor(t){
  const valid = orders[t.id] && orders[t.id].every(i => i < t.items.length);
  if(!valid){ newOrder(t); saveState(); }
  return orders[t.id];
}

function qKey(testId, i){ return testId + '::' + i; }

function renderRail(){
  const rail = document.getElementById('rail');
  rail.innerHTML = '';
  TESTS.forEach((t, i) => {
    const b = document.createElement('button');
    const qCount = t.items.filter(it => it.type !== 'note').length;
    b.className = i === activeIdx ? 'active' : '';
    b.innerHTML = `<span class="n">${t.tab}</span>${t.title.replace('&amp;','&')}`;
    b.onclick = () => { activeIdx = i; renderAll(); window.scrollTo({top:0, behavior:'smooth'}); };
    rail.appendChild(b);
  });
  const total = TESTS[activeIdx].items.filter(it => it.type !== 'note').length;
  document.getElementById('railCount').textContent = total + ' items';
}

function renderIntro(){
  const t = TESTS[activeIdx];
  const qCount = t.items.filter(it => it.type !== 'note').length;
  document.getElementById('introCard').innerHTML = `
    <h2>${t.title.replace('&amp;','&')}</h2>
    <div class="meta">${qCount} items \u00b7 multiple choice &amp; select-all-that-apply</div>
    <p>${t.desc}</p>${historyLine(t.id)}`;
}

function historyLine(id){
  const h = (attempts[id] || []);
  if(!h.length) return '';
  const best = h.reduce((m,a)=> a.pct>m.pct ? a : m, h[0]);
  const last = h[h.length-1];
  return `<div class="history">Attempts: ${h.length} \u00b7 Last: ${last.score}/${last.total} (${last.pct}%) \u00b7 Best: ${best.pct}%</div>`;
}
function scoreFor(t){
  const items = t.items.filter(it => it.type !== 'note');
  let c = 0;
  items.forEach(it => {
    const i = t.items.indexOf(it);
    if((answers[qKey(t.id,i)]||[]).slice().sort().join(',') === it.correct.slice().sort().join(',')) c++;
  });
  return {score:c, total:items.length, pct:Math.round(c/items.length*100)};
}

function renderScoreBanner(){
  const t = TESTS[activeIdx];
  const banner = document.getElementById('scoreBanner');
  if(!locked[t.id]){ banner.className = 'score-banner'; banner.innerHTML=''; return; }
  const items = t.items.filter(it => it.type !== 'note');
  let correctCount = 0;
  items.forEach((it, i) => {
    const realIdx = t.items.indexOf(it);
    const sel = (answers[qKey(t.id, realIdx)] || []).slice().sort().join(',');
    const corr = it.correct.slice().sort().join(',');
    if(sel === corr) correctCount++;
  });
  const pct = Math.round((correctCount / items.length) * 100);
  banner.className = 'score-banner show';
  banner.style.background = pct >= 80 ? 'var(--green-pale)' : pct >= 60 ? 'var(--amber-pale)' : 'var(--brick-pale)';
  banner.innerHTML = `<div class="big">${correctCount} / ${items.length}</div><div class="sub">${pct}% correct \u2014 review rationales below, or reset to try again.</div>`;
}

function renderQuestions(){
  const t = TESTS[activeIdx];
  const list = document.getElementById('qList');
  list.innerHTML = '';
  let qNum = 0;
  orderFor(t).forEach(i => {
    const it = t.items[i];
    if(it.type === 'note'){
      const d = document.createElement('div');
      d.className = 'note';
      d.innerHTML = `<span class="label">Case Study</span>${it.text}`;
      list.appendChild(d);
      return;
    }
    qNum++;
    const key = qKey(t.id, i);
    const isLocked = !!locked[t.id];
    const sel = answers[key] || [];
    const corr = it.correct;

    const card = document.createElement('div');
    card.className = 'q' + (isLocked ? ' locked' : '');
    if(isLocked){
      const selSorted = sel.slice().sort().join(',');
      const corrSorted = corr.slice().sort().join(',');
      card.className += selSorted === corrSorted ? ' correct' : ' incorrect';
    }

    const head = document.createElement('div');
    head.className = 'q-head';
    head.innerHTML = `<span class="q-num">Q${qNum}</span><span class="q-type${it.type==='sata'?' sata':''}">${it.type==='sata' ? 'SATA' : 'Multiple Choice'}</span>`;
    card.appendChild(head);

    const p = document.createElement('p');
    p.className = 'q-prompt';
    p.textContent = it.prompt;
    card.appendChild(p);

    if(it.type === 'sata'){
      const hint = document.createElement('p');
      hint.className = 'q-sata-hint';
      hint.textContent = 'Select all that apply.';
      card.appendChild(hint);
    }

    const opts = document.createElement('div');
    opts.className = 'opts';
    it.options.forEach(([k, label]) => {
      const row = document.createElement('label');
      row.className = 'opt';
      const input = document.createElement('input');
      input.type = it.type === 'sata' ? 'checkbox' : 'radio';
      input.name = key;
      input.value = k;
      input.checked = sel.includes(k);
      input.disabled = isLocked;
      input.onchange = () => {
        if(it.type === 'sata'){
          let cur = answers[key] || [];
          if(input.checked) cur = [...cur, k]; else cur = cur.filter(x => x !== k);
          answers[key] = cur;
        } else {
          answers[key] = [k];
        }
        renderQuestions();
        updateProgress();
        saveState();
      };
      row.appendChild(input);
      const kEl = document.createElement('span');
      kEl.className = 'key';
      kEl.textContent = k + '.';
      row.appendChild(kEl);
      const txt = document.createElement('span');
      txt.textContent = label;
      row.appendChild(txt);
      if(isLocked){
        if(corr.includes(k)) row.classList.add('is-correct');
        else if(sel.includes(k)) row.classList.add('is-wrong');
      }
      opts.appendChild(row);
    });
    card.appendChild(opts);

    const rat = document.createElement('div');
    rat.className = 'rationale';
    rat.innerHTML = `<span class="label">Rationale</span>${it.rationale}`;
    card.appendChild(rat);

    list.appendChild(card);
  });
}

function updateProgress(){
  const t = TESTS[activeIdx];
  const items = t.items.filter(it => it.type !== 'note');
  let answered = 0;
  t.items.forEach((it, i) => {
    if(it.type === 'note') return;
    if((answers[qKey(t.id, i)] || []).length > 0) answered++;
  });
  document.getElementById('progressText').textContent = `${answered} of ${items.length} answered`;
  document.getElementById('submitBtn').disabled = !!locked[t.id];
  document.getElementById('submitBtn').textContent = locked[t.id] ? 'Submitted' : 'Submit Test';
  document.getElementById('resetBtn').textContent = locked[t.id] ? 'Retake (new order)' : 'Reset & shuffle';
}

function renderAll(){
  renderRail();
  renderIntro();
  renderScoreBanner();
  renderQuestions();
  updateProgress();
}

document.getElementById('submitBtn').onclick = () => {
  const t = TESTS[activeIdx];
  locked[t.id] = true;
  (attempts[t.id] = attempts[t.id] || []).push({...scoreFor(t), at: Date.now()});
  renderAll();
  saveState();
  window.scrollTo({top:0, behavior:'smooth'});
};

document.getElementById('resetBtn').onclick = () => {
  const t = TESTS[activeIdx];
  locked[t.id] = false;
  t.items.forEach((it, i) => { delete answers[qKey(t.id, i)]; });
  newOrder(t); // every retake gets a fresh question order
  renderAll();
  window.scrollTo({top:0, behavior:'smooth'});
  saveState();
};

function saveState(){
  try{
    localStorage.setItem('peds_nclex_answers', JSON.stringify(answers));
    localStorage.setItem('peds_nclex_locked', JSON.stringify(locked));
    localStorage.setItem('peds_nclex_attempts', JSON.stringify(attempts));
    localStorage.setItem('peds_nclex_missed', JSON.stringify(missed));
    localStorage.setItem('peds_nclex_orders', JSON.stringify(orders));
  }catch(e){ /* storage unavailable */ }
  if(window.cloudSave) window.cloudSave({answers, locked, attempts, missed, orders});
}
function loadState(){
  try{
    const a = localStorage.getItem('peds_nclex_answers');
    const l = localStorage.getItem('peds_nclex_locked');
    if(a) answers = JSON.parse(a);
    if(l) locked = JSON.parse(l);
    const h = localStorage.getItem('peds_nclex_attempts');
    if(h) attempts = JSON.parse(h);
    const m = localStorage.getItem('peds_nclex_missed');
    if(m) missed = JSON.parse(m);
    const o = localStorage.getItem('peds_nclex_orders');
    if(o) orders = JSON.parse(o);
  }catch(e){ /* ignore */ }
}


/* ---------- QUIZ MODE ---------- */
// Question bank from the four topic tests (the combined exam reuses these, so it's excluded).
const BANK = [];
TESTS.slice(0,4).forEach(t => {
  let context = null;
  t.items.forEach((it, i) => {
    if(it.type === 'note'){ context = it.text; return; }
    BANK.push({ id: t.id + '::' + i, testId: t.id, topic: t.title.replace('&amp;','&'), context, ...it });
  });
});

let mode = 'tests';
let quiz = null; // {qs, i, picked, checked, right, wrongIds, scope}
let lastQuiz = null; // previous quiz's question list, so the next one never repeats its order

function setMode(m){
  mode = m;
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  document.getElementById('testsView').classList.toggle('hidden', m !== 'tests');
  document.getElementById('footerBar').classList.toggle('hidden', m !== 'tests');
  document.getElementById('quizView').classList.toggle('hidden', m !== 'quiz');
  document.getElementById('railCount').classList.toggle('hidden', m !== 'tests');
  if(m === 'quiz' && !quiz) renderQuizSetup();
  window.scrollTo({top:0});
}
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderQuizSetup(){
  const v = document.getElementById('quizView');
  const missedCount = BANK.filter(q => missed[q.id]).length;
  const topics = TESTS.slice(0,4).map(t => {
    const n = BANK.filter(q => q.testId === t.id).length;
    const h = attempts['quiz:' + t.id] || [];
    const last = h.length ? ` · last ${h[h.length-1].pct}%` : '';
    return `<label class="topic"><input type="checkbox" value="${t.id}" checked><span>${t.title}<small>${n} questions${last}</small></span></label>`;
  }).join('');
  const recent = Object.entries(attempts).filter(([k]) => k.startsWith('quiz:')).flatMap(([k, list]) => list.map(a => ({...a, k})))
    .sort((a,b) => b.at - a.at).slice(0,5);
  v.innerHTML = `
    <div class="card">
      <h2>Quiz Mode</h2>
      <p class="sub">One question at a time with instant feedback and rationales. Questions you miss are saved so you can drill them later.</p>
      <div class="topic-grid">${topics}</div>
      <div class="row">
        <label>Questions <select id="qzCount"><option value="10">10</option><option value="20" selected>20</option><option value="30">30</option><option value="999">All</option></select></label>
        <button class="primary" id="qzStart">Start quiz</button>
        <button class="ghost" id="qzMissed" ${missedCount ? '' : 'disabled'}>Review missed (${missedCount})</button>
      </div>
    </div>
    ${recent.length ? `<div class="card"><h2 style="font-size:17px">Recent quizzes</h2><ul class="missed-list">${recent.map(a => `<li>${new Date(a.at).toLocaleDateString()} — ${a.score}/${a.total} (${a.pct}%) · ${a.k === 'quiz:missed' ? 'Missed review' : a.k === 'quiz:mixed' ? 'Mixed topics' : ((TESTS.find(t => 'quiz:'+t.id === a.k)||{}).title || '')}</li>`).join('')}</ul></div>` : ''}`;
  document.getElementById('qzStart').onclick = () => {
    const ids = [...v.querySelectorAll('.topic input:checked')].map(x => x.value);
    if(!ids.length) return;
    const n = +document.getElementById('qzCount').value;
    const qs = freshShuffle(BANK.filter(q => ids.includes(q.testId)), lastQuiz, q => q.id).slice(0, n);
    startQuiz(qs, ids.length === 1 ? ids[0] : 'mixed');
  };
  document.getElementById('qzMissed').onclick = () => startQuiz(freshShuffle(BANK.filter(q => missed[q.id]), lastQuiz, q => q.id), 'missed');
}

function startQuiz(qs, scope){
  lastQuiz = qs;
  quiz = { qs, i: 0, picked: [], checked: false, right: 0, wrongIds: [], scope };
  renderQuizQ();
}

function renderQuizQ(){
  const v = document.getElementById('quizView');
  const q = quiz.qs[quiz.i];
  const isSata = q.type === 'sata';
  const ok = quiz.checked && quiz.picked.slice().sort().join(',') === q.correct.slice().sort().join(',');
  const opts = q.options.map(([k, label]) => {
    let cls = 'opt';
    if(quiz.checked){
      if(q.correct.includes(k)) cls += ' is-correct';
      else if(quiz.picked.includes(k)) cls += ' is-wrong';
    }
    return `<label class="${cls}"><input type="${isSata?'checkbox':'radio'}" name="qz" value="${k}" ${quiz.picked.includes(k)?'checked':''} ${quiz.checked?'disabled':''}><span class="key">${k}.</span><span>${esc(label)}</span></label>`;
  }).join('');
  v.innerHTML = `
    <div class="quiz-top"><span>Question ${quiz.i+1} of ${quiz.qs.length}</span><span>${quiz.right} correct</span></div>
    <div class="bar"><i style="width:${(quiz.i/quiz.qs.length)*100}%"></i></div>
    ${q.context ? `<div class="note"><span class="label">Case Study</span>${q.context}</div>` : ''}
    <div class="q quiz ${quiz.checked ? (ok ? 'correct' : 'incorrect') : ''}">
      <div class="q-head"><span class="q-num">${esc(q.topic)}</span><span class="q-type${isSata?' sata':''}">${isSata?'SATA':'Multiple Choice'}</span></div>
      <p class="q-prompt">${esc(q.prompt)}</p>
      ${isSata ? '<p class="q-sata-hint">Select all that apply.</p>' : ''}
      <div class="opts">${opts}</div>
      ${quiz.checked ? `<div class="feedback ${ok?'ok':'bad'}">${ok ? 'Correct' : 'Not quite — correct answer: ' + q.correct.join(', ')}</div><div class="rationale"><span class="label">Rationale</span>${q.rationale}</div>` : ''}
    </div>
    <div class="row" style="justify-content:space-between">
      <button class="ghost" id="qzQuit">End quiz</button>
      <button class="primary" id="qzNext" ${!quiz.checked && !quiz.picked.length ? 'disabled' : ''}>${quiz.checked ? (quiz.i+1 < quiz.qs.length ? 'Next question' : 'See results') : 'Check answer'}</button>
    </div>`;
  v.querySelectorAll('input[name=qz]').forEach(inp => inp.onchange = () => {
    if(isSata){ quiz.picked = inp.checked ? [...quiz.picked, inp.value] : quiz.picked.filter(x => x !== inp.value); }
    else quiz.picked = [inp.value];
    document.getElementById('qzNext').disabled = !quiz.picked.length;
  });
  document.getElementById('qzQuit').onclick = () => quiz.i > 0 || quiz.checked ? finishQuiz(true) : (quiz = null, renderQuizSetup());
  document.getElementById('qzNext').onclick = () => {
    if(!quiz.checked){
      quiz.checked = true;
      const good = quiz.picked.slice().sort().join(',') === q.correct.slice().sort().join(',');
      if(good){ quiz.right++; delete missed[q.id]; } else { quiz.wrongIds.push(q.id); missed[q.id] = true; }
      saveState();
      renderQuizQ();
    } else if(quiz.i + 1 < quiz.qs.length){
      quiz.i++; quiz.picked = []; quiz.checked = false; renderQuizQ(); window.scrollTo({top:0});
    } else finishQuiz(false);
  };
}

function finishQuiz(early){
  const answered = quiz.i + (quiz.checked ? 1 : 0);
  const v = document.getElementById('quizView');
  if(answered > 0){
    const pct = Math.round(quiz.right / answered * 100);
    (attempts['quiz:' + quiz.scope] = attempts['quiz:' + quiz.scope] || []).push({score: quiz.right, total: answered, pct, at: Date.now()});
    saveState();
    const wrong = quiz.wrongIds.map(id => BANK.find(q => q.id === id));
    v.innerHTML = `
      <div class="card">
        <h2>${quiz.right} / ${answered} correct (${pct}%)</h2>
        <p class="sub">${early ? 'Quiz ended early. ' : ''}${wrong.length ? 'These were added to your Review missed list:' : 'Perfect run — nothing missed.'}</p>
        ${wrong.length ? `<ul class="missed-list">${wrong.map(q => `<li>${esc(q.prompt)}</li>`).join('')}</ul>` : ''}
        <div class="row" style="margin-top:16px">
          ${wrong.length ? '<button class="primary" id="qzRetry">Retry missed now</button>' : ''}
          <button class="ghost" id="qzHome">New quiz</button>
        </div>
      </div>`;
    const retry = document.getElementById('qzRetry');
    if(retry) retry.onclick = () => startQuiz(freshShuffle(wrong, lastQuiz, q => q.id), 'missed');
    document.getElementById('qzHome').onclick = () => { quiz = null; renderQuizSetup(); };
  } else { quiz = null; renderQuizSetup(); }
  window.scrollTo({top:0});
}

// Called by the Firebase module when cloud data arrives
window.getLocalState = () => ({answers, locked, attempts, missed, orders});
window.applyCloudState = (d) => {
  answers = d.answers || {}; locked = d.locked || {}; attempts = d.attempts || {}; missed = d.missed || {}; orders = d.orders || orders;
  try{
    localStorage.setItem('peds_nclex_answers', JSON.stringify(answers));
    localStorage.setItem('peds_nclex_locked', JSON.stringify(locked));
    localStorage.setItem('peds_nclex_attempts', JSON.stringify(attempts));
    localStorage.setItem('peds_nclex_missed', JSON.stringify(missed));
    localStorage.setItem('peds_nclex_orders', JSON.stringify(orders));
  }catch(e){}
  renderAll();
  if(mode === 'quiz' && !quiz) renderQuizSetup();
};

loadState();
renderAll();
</script>
<script type="module" src="app-firebase.js"></script>
</body>
