name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # lets GitHub prove its identity to Google (no stored keys)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/366052719754/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-deployer@pediatric-nclex-prep.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy hosting + Firestore rules
        run: npx -y firebase-tools@latest deploy --only hosting,firestore:rules --project pediatric-nclex-prep --non-interactive
